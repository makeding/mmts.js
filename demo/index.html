<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>mpegts.js demo</title>
    <link rel="stylesheet" type="text/css" href="demo.css" />
</head>

<body>
    
    <div class="mainContainer">
        <div>
            <div id="streamURL">
                <div class="url-input">
                    <label for="sURL">Stream URL:</label>
                    <input id="sURL" type="text" value="BS17_0.mmts" />
                    <button onclick="switch_mds()">Switch to MediaDataSource</button>
                </div>
                <div class="options">
                    <label for="mediaType">type</label>
                    <select id="mediaType" onchange="saveSettings()">
                        <option value="m2ts">m2ts</option>
                        <option value="mmts" selected>mmts</option>
                        <option value="mpegts">mpegts</option>
                        <option value="mse">mse</option>
                        <option value="flv">flv</option>
                    </select>
                    <input type="checkbox" id="isLive" onchange="saveSettings()" />
                    <label for="isLive">isLive</label>
                    <input type="checkbox" id="withCredentials" onchange="saveSettings()" />
                    <label for="withCredentials">withCredentials</label>
                    <input type="checkbox" id="liveBufferLatencyChasing" onchange="saveSettings()" />
                    <label for="liveBufferLatencyChasing">liveBufferLatencyChasing</label>
                </div>
            </div>
            <div id="mediaSourceURL" class="hidden">
                <div class="url-input">
                    <label for="msURL">MediaDataSource JsonURL:</label>
                    <input id="msURL" type="text" value="http://127.0.0.1/flv/7182741.json" />
                    <button onclick="switch_url()">Switch to URL</button>
                </div>
            </div>
        </div>
        <div class="video-container">
            <div>
                <video name="videoElement" class="centeredVideo" controls autoplay playsinline>
                    Your browser is too old which doesn't support HTML5 video.
                </video>
            </div>
        </div>
        <div class="controls">
            <button onclick="player_load()">Load</button>
            <button onclick="player_start()">Start</button>
            <button onclick="player_pause()">Pause</button>
            <button onclick="player_destroy()">Destroy</button>
            <input style="width:100px" type="text" name="seekpoint"/>
            <button onclick="player_seekto()">SeekTo</button>
            <button onclick="player_switch_primary_audio()">Primary Audio</button>
            <button onclick="player_switch_secondary_audio()">Next Audio</button>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS audio tracks</div>
            <div id="mmtsAudioTracks" class="track-list">No MMTS audio tracks</div>
        </div>
        <textarea name="logcatbox" class="logcatBox" rows="10" readonly></textarea>
    </div>

    <script src="../dist/mpegts.js"></script>
    
    <script>
        var checkBoxFields = ['isLive', 'withCredentials', 'liveBufferLatencyChasing'];
        var streamURL, mediaSourceURL;
        var mmtsAudioTracks = null;

        function player_load() {
            console.log('isSupported: ' + mpegts.isSupported());
            if (mediaSourceURL.className === '') {
                var url = document.getElementById('msURL').value;
    
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function (e) {
                    var mediaDataSource = JSON.parse(xhr.response);
                    player_load_mds(mediaDataSource);
                }
                xhr.send();
            } else {
                var i;
                var mediaDataSource = {
                    type: document.getElementById('mediaType').value
                };
                for (i = 0; i < checkBoxFields.length; i++) {
                    var field = checkBoxFields[i];
                    /** @type {HTMLInputElement} */
                    var checkbox = document.getElementById(field);
                    mediaDataSource[field] = checkbox.checked;
                }
                mediaDataSource['url'] = new URL(document.getElementById('sURL').value, window.location.href).href;
                console.log('MediaDataSource', mediaDataSource);
                player_load_mds(mediaDataSource);
            }
        }

        function player_load_mds(mediaDataSource) {
            var element = document.getElementsByName('videoElement')[0];
            if (typeof player !== "undefined") {
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
            }
            player = mpegts.createPlayer(mediaDataSource, {
                enableWorker: true,
                lazyLoadMaxDuration: 3 * 60,
                seekType: 'range',
                liveBufferLatencyChasing: document.getElementById('liveBufferLatencyChasing').checked,
            });
            player.attachMediaElement(element);
            player.load();
            resetMMTSAudioTracks();
            player.on(mpegts.Events.MMTS_AUDIO_TRACKS, function(data) {
                mmtsAudioTracks = data;
                renderMMTSAudioTracks();
            });
        }

        function player_start() {
            player.play();
        }

        function player_pause() {
            player.pause();
        }

        function player_destroy() {
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
        }

        function player_seekto() {
            var input = document.getElementsByName('seekpoint')[0];
            player.currentTime = parseFloat(input.value);
        }

        function player_switch_primary_audio() {
            if (player != null && player.switchPrimaryAudio) {
                player.switchPrimaryAudio();
            }
        }

        function player_switch_secondary_audio() {
            if (player != null && player.switchSecondaryAudio) {
                player.switchSecondaryAudio();
            }
        }

        function resetMMTSAudioTracks() {
            mmtsAudioTracks = null;
            renderMMTSAudioTracks();
        }

        function renderMMTSAudioTracks() {
            var container = document.getElementById('mmtsAudioTracks');
            if (!container) {
                return;
            }
            if (!mmtsAudioTracks || !mmtsAudioTracks.tracks || mmtsAudioTracks.tracks.length === 0) {
                container.textContent = 'No MMTS audio tracks';
                return;
            }

            container.innerHTML = '';
            mmtsAudioTracks.tracks.forEach(function(track) {
                var item = document.createElement('div');
                item.className = 'track-item' + (track.selected ? ' selected' : '');
                item.textContent = formatMMTSAudioTrack(track);
                item.onclick = function() {
                    player_select_audio_track(track.packetId);
                };
                container.appendChild(item);
            });
        }

        function formatMMTSAudioTrack(track) {
            var parts = [];
            parts.push(track.selected ? '*' : ' ');
            parts.push('packet_id=0x' + Number(track.packetId).toString(16));
            if (track.language) {
                parts.push(track.language);
            }
            if (track.channelLayout) {
                parts.push(track.channelLayout);
            } else if (track.channelCount) {
                parts.push(track.channelCount + 'ch');
            }
            if (track.audioSampleRate) {
                parts.push(track.audioSampleRate + 'Hz');
            }
            if (track.componentType !== undefined) {
                parts.push('component=0x' + Number(track.componentType).toString(16));
            }
            return parts.join(' ');
        }

        function player_select_audio_track(packetId) {
            if (player != null && player.selectAudioTrack) {
                player.selectAudioTrack(packetId);
            }
        }

        function switch_url() {
            streamURL.className = '';
            mediaSourceURL.className = 'hidden';
            saveSettings();
        }

        function switch_mds() {
            streamURL.className = 'hidden';
            mediaSourceURL.className = '';
            saveSettings();
        }

        function ls_get(key, def) {
            try {
                var ret = localStorage.getItem('mpegts_demo.' + key);
                if (ret === null) {
                    ret = def;
                }
                return ret;
            } catch (e) {}
            return def;
        }

        function ls_set(key, value) {
            try {
                localStorage.setItem('mpegts_demo.' + key, value);
            } catch (e) {}
        }

        function saveSettings() {
            if (mediaSourceURL.className === '') {
                ls_set('inputMode', 'MediaDataSource');
            } else {
                ls_set('inputMode', 'StreamURL');
            }
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                ls_set(field, checkbox.checked ? '1' : '0');
            }
            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            ls_set('mediaType', mediaType.value);
            ls_set('msURL', msURL.value);
            ls_set('sURL', sURL.value);
            console.log('save');
        }

        function loadSettings() {
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                var c = ls_get(field, checkbox.checked ? '1' : '0');
                checkbox.checked = c === '1' ? true : false;
            }

            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            mediaType.value = ls_get('mediaType', mediaType.value);
            msURL.value = ls_get('msURL', msURL.value);
            sURL.value = ls_get('sURL', sURL.value);
            if (sURL.value === '../sample/BS17_0.mmts') {
                sURL.value = 'BS17_0.mmts';
            }
            if (ls_get('inputMode', 'StreamURL') === 'StreamURL') {
                switch_url();
            } else {
                switch_mds();
            }
        }

        function showVersion() {
            var version = mpegts.version;
            document.title = document.title + " (v" + version + ")";
        }

        var sURL = document.getElementById('sURL');
        sURL.onkeyup = function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                saveSettings()
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
                player_load();
            }
        };

        var logcatbox = document.getElementsByName('logcatbox')[0];
        mpegts.LoggingControl.addLogListener(function(type, str) {
            logcatbox.value = logcatbox.value + str + '\n';
            logcatbox.scrollTop = logcatbox.scrollHeight;
        });

        document.addEventListener('DOMContentLoaded', function () {
            streamURL = document.getElementById('streamURL');
            mediaSourceURL = document.getElementById('mediaSourceURL');
            loadSettings();
            showVersion();
            player_load();
        });
    </script>
    
</body>

</html>
