<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>mmts.js demo</title>
    <link rel="stylesheet" type="text/css" href="demo.css" />
</head>

<body>
    
    <div class="mainContainer">
        <div>
            <div id="streamURL">
                <div class="url-input">
                    <label for="sURL">Stream URL:</label>
                    <input id="sURL" type="text" value="BS17_0.mmts" onchange="saveSettings()" />
                    <button onclick="switch_mds()">Switch to MediaDataSource</button>
                </div>
                <div class="options">
                    <label for="mediaType">type</label>
                    <select id="mediaType" onchange="saveSettings()">
                        <option value="mmts" selected>mmts</option>
                    </select>
                    <input type="checkbox" id="isLive" onchange="saveSettings()" checked />
                    <label for="isLive">isLive</label>
                    <input type="checkbox" id="withCredentials" onchange="saveSettings()" />
                    <label for="withCredentials">withCredentials</label>
                    <input type="checkbox" id="liveBufferLatencyChasing" onchange="saveSettings()" />
                    <label for="liveBufferLatencyChasing">liveBufferLatencyChasing</label>
                    <label for="mmtsVideoPid">MMTS video PID</label>
                    <input id="mmtsVideoPid" type="text" value="" placeholder="auto / 0xf101" onchange="saveSettings()" style="width:120px" />
                    <input type="checkbox" id="mmtsForceSDRColorimetry" />
                    <label for="mmtsForceSDRColorimetry">Force SDR color tags (prototype)</label>
                </div>
            </div>
            <div id="mediaSourceURL" class="hidden">
                <div class="url-input">
                    <label for="msURL">MediaDataSource JsonURL:</label>
                    <input id="msURL" type="text" value="http://127.0.0.1/mmts/source.json" onchange="saveSettings()" />
                    <button onclick="switch_url()">Switch to URL</button>
                </div>
            </div>
        </div>
        <div class="video-container">
            <div>
                <video name="videoElement" muted class="centeredVideo" controls playsinline>
                    Your browser is too old which doesn't support HTML5 video.
                </video>
                <canvas id="bt2446cWebGPUCanvas" class="bt2446c-webgpu-canvas"></canvas>
                <div id="ttmlSubtitleOverlay" class="ttml-subtitle-overlay"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="player_load()">Load</button>
            <button onclick="player_start()">Start</button>
            <button onclick="player_pause()">Pause</button>
            <button onclick="player_destroy()">Destroy</button>
            <input style="width:100px" type="text" name="seekpoint"/>
            <button onclick="player_seekto()">SeekTo</button>
            <button onclick="player_switch_primary_audio()">Primary Audio</button>
            <button onclick="player_switch_secondary_audio()">Next Audio</button>
            <button onclick="probe_video_capability()">Probe Codec</button>
            <button onclick="probe_video_frame_color_space()">Probe VideoFrame color</button>
            <button onclick="inject_test_ttml_subtitle()">Test TTML</button>
            <input type="checkbox" id="bt2446cWebGPUEnabled" onchange="set_bt2446c_webgpu_enabled()" />
            <label for="bt2446cWebGPUEnabled">WebGPU HDR to SDR</label>
            <select id="bt2446WebGPUMode" onchange="set_bt2446_webgpu_mode()">
                <option value="arib-display" selected>ARIB inverse (display-referred)</option>
                <option value="arib-scene">ARIB inverse (scene-referred)</option>
                <option value="bt2446arib">Experimental 291-nit tone map</option>
                <option value="bt2446a">BT.2446-A (YCbCr chroma scaling)</option>
                <option value="bt2446c">BT.2446-C (Lab chroma correction)</option>
            </select>
            <span id="bt2446cWebGPUStatus" class="bt2446c-webgpu-status">off</span>
        </div>
        <div class="track-panel">
            <div class="track-title">Video info</div>
            <div id="videoInfo" class="track-list">No video info</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS video tracks</div>
            <div id="mmtsVideoTracks" class="track-list">No MMTS video tracks</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS audio tracks</div>
            <div id="mmtsAudioTracks" class="track-list">No MMTS audio tracks</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS subtitle tracks</div>
            <div id="mmtsSubtitleTracks" class="track-list">No MMTS subtitle tracks</div>
            <div id="ttmlSubtitleStatus" class="track-list ttml-subtitle-status">TTML payload events=0</div>
            <div id="ttmlFontDownloads" class="track-list ttml-font-downloads">No TTML fonts</div>
        </div>
        <textarea name="logcatbox" class="logcatBox" rows="10"></textarea>
    </div>

    <script src="../dist/mpegts.js"></script>
    <script src="webgpu-bt2446c.js"></script>
    <script type="module">
        import * as aribb62js from '../../aribb62.js/src/index.js';
        window.aribb62js = aribb62js;
    </script>
    
    <script>
        var checkBoxFields = ['isLive', 'withCredentials', 'liveBufferLatencyChasing'];
        var streamURL, mediaSourceURL;
        var mmtsAudioTracks = null;
        var mmtsVideoTracks = null;
        var mmtsSubtitleTracks = null;
        var lastMediaInfo = null;
        var lastVideoContentType = 'video/mp4; codecs="hvc1.2.1.L183.B0"';
        var ttmlSubtitleRenderer = null;
        var ttmlSubtitleRendererUnavailable = false;
        var ttmlSubtitleEventCount = 0;
        var ttmlSubtitleLastStatus = null;
        var ttmlSubtitleDataCache = [];
        var ttmlSubtitleReplayActive = false;
        var ttmlCachedFontFaces = [];
        var ttmlCachedFontFaceKeys = {};
        var selectedMMTSSubtitlePacketId = null;
        var lastStatisticsLogTime = 0;
        var lastStatisticsLogState = null;
        var lastLogcatLine = '';
        var lastLogcatLineTime = 0;
        var lastMediaInfoLogText = '';
        var lastMMTSAudioTracksLogText = '';
        var bt2446cWebGPURenderer = null;
        var lastMMTSVideoTracksLogText = '';
        var lastMMTSSubtitleTracksLogText = '';
        var lastCapabilityProbeKey = '';

        function shouldLogLibraryLine(type, line) {
            if (type === 'verbose' || type === 'debug') {
                return false;
            }
            return !/^\[MP4Remuxer\] > Extend video sample duration/.test(line);
        }

        function appendLogcatLine(line) {
            var now = Date.now();
            if (line === lastLogcatLine && now - lastLogcatLineTime < 60000) {
                return false;
            }
            lastLogcatLine = line;
            lastLogcatLineTime = now;
            var box = document.getElementsByName('logcatbox')[0];
            if (box) {
                box.value = box.value + line + '\n';
                box.scrollTop = box.scrollHeight;
            }
            return true;
        }

        function logDemo(message) {
            var line = '[demo] ' + message;
            if (appendLogcatLine(line)) {
                console.log(line);
            }
        }

        function player_load() {
            console.log('isSupported: ' + mpegts.isSupported());
            saveSettings();
            if (mediaSourceURL.className === '') {
                var url = document.getElementById('msURL').value;
    
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function (e) {
                    var mediaDataSource = JSON.parse(xhr.response);
                    player_load_mds(mediaDataSource);
                }
                xhr.send();
            } else {
                var i;
                var mediaDataSource = {
                    type: document.getElementById('mediaType').value
                };
                for (i = 0; i < checkBoxFields.length; i++) {
                    var field = checkBoxFields[i];
                    /** @type {HTMLInputElement} */
                    var checkbox = document.getElementById(field);
                    mediaDataSource[field] = checkbox.checked;
                }
                mediaDataSource['url'] = new URL(document.getElementById('sURL').value, window.location.href).href;
                console.log('MediaDataSource', mediaDataSource);
                player_load_mds(mediaDataSource);
            }
        }

        function player_load_mds(mediaDataSource) {
            prepareMediaDataSourceForNativeControls(mediaDataSource, do_player_load_mds);
        }

        function do_player_load_mds(mediaDataSource) {
            var element = document.getElementsByName('videoElement')[0];
            if (typeof player !== "undefined") {
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
            }
            var isMMTS = mediaDataSource.type === 'mmts';
            var isMMTSLive = isMMTS && mediaDataSource.isLive === true;
            var config = {
                enableWorker: true,
                lazyLoad: true,
                lazyLoadOnLive: isMMTSLive,
                lazyLoadMaxDuration: isMMTSLive ? 18 : (isMMTS ? 90 : 3 * 60),
                lazyLoadRecoverDuration: isMMTSLive ? 8 : (isMMTS ? 60 : 30),
                startupBufferDuration: isMMTSLive ? 3 : 0,
                seekType: 'range',
                rangeLoadZeroStart: isMMTS,
                liveBufferLatencyChasing: document.getElementById('liveBufferLatencyChasing').checked,
            };
            if (isMMTS) {
                config.mmtsForceSDRColorimetry =
                    document.getElementById('mmtsForceSDRColorimetry').checked;
                config.autoCleanupSourceBuffer = true;
                config.autoCleanupMaxBackwardDuration = isMMTSLive ? 10 : 6;
                config.autoCleanupMinBackwardDuration = isMMTSLive ? 4 : 2;
                config.statisticsInfoReportInterval = 1000;
                config.lazyLoadMaxBytes = isMMTSLive ? 64 * 1024 * 1024 : 112 * 1024 * 1024;
                config.lazyLoadRecoverBytes = isMMTSLive ? 32 * 1024 * 1024 : 96 * 1024 * 1024;
                config.mseBufferVideoSoftLimitBytes = isMMTSLive ? 64 * 1024 * 1024 : 112 * 1024 * 1024;
                config.mseBufferVideoHardLimitBytes = isMMTSLive ? 96 * 1024 * 1024 : 128 * 1024 * 1024;
                config.mseBufferAudioSoftLimitBytes = isMMTSLive ? 8 * 1024 * 1024 : 8 * 1024 * 1024;
                config.mseBufferAudioHardLimitBytes = isMMTSLive ? 12 * 1024 * 1024 : 12 * 1024 * 1024;
                config.mseBufferForwardTargetDuration = isMMTSLive ? 18 : 90;
                config.mseBufferRecoverForwardDuration = isMMTSLive ? 8 : 60;
                config.mseAppendTrackLeadLimit = isMMTSLive ? 1.5 : 2;
                config.mseAppendBatchDuration = isMMTSLive ? 0.35 : 0.5;
                config.mmtsClampVideoTimestampGap = false;
                config.mmtsClampAudioTimestampGap = false;
                logDemo('MMTS 4K/8K buffering: forward=' +
                    (isMMTSLive ? '18s/64MiB' : '90s/112MiB') +
                    ', recover=' + (isMMTSLive ? '8s/32MiB' : '60s/96MiB') +
                    ', cleanup=back ' + (isMMTSLive ? '10/4s' : '6/2s') +
                    ', startup=' +
                    (isMMTSLive ? '3s' : '0s') +
                    ', append_batch=' + (isMMTSLive ? '0.35s' : '0.5s') +
                    ', append_lead=' + (isMMTSLive ? '1.5s' : '2s') +
                    ', timeline=preserve-gaps' +
                    (isMMTSLive ? ', lazyLoadOnLive=true' : ''));
            }
            var mmtsVideoPacketId = parseOptionalInteger(document.getElementById('mmtsVideoPid').value);
            if (mmtsVideoPacketId != null && mediaDataSource.type === 'mmts') {
                config.mmtsVideoPacketId = mmtsVideoPacketId;
                logDemo('force MMTS video packet_id=0x' + mmtsVideoPacketId.toString(16));
            } else if (mmtsVideoPacketId != null) {
                logDemo('ignore MMTS video packet_id for type=' + mediaDataSource.type);
            }
            player = mpegts.createPlayer(mediaDataSource, config);
            setupMediaElementDebug(element);
            player.attachMediaElement(element);
            setupTTMLSubtitleOverlay(element);
            lastMediaInfoLogText = '';
            lastMMTSAudioTracksLogText = '';
            lastMMTSVideoTracksLogText = '';
            lastMMTSSubtitleTracksLogText = '';
            lastStatisticsLogState = null;
            lastCapabilityProbeKey = '';
            resetVideoInfo();
            resetMMTSVideoTracks();
            resetMMTSAudioTracks();
            resetMMTSSubtitleTracks();
            player.on(mpegts.Events.ERROR, function(type, detail, info) {
                logDemo('mpegts error: type=' + type + ', detail=' + detail + ', info=' + JSON.stringify(info || null));
            });
            player.on(mpegts.Events.MEDIA_INFO, function(info) {
                lastMediaInfo = info || null;
                renderVideoInfo();
                var mediaInfoLogText = JSON.stringify(info);
                if (mediaInfoLogText !== lastMediaInfoLogText) {
                    lastMediaInfoLogText = mediaInfoLogText;
                    logDemo('media info: ' + mediaInfoLogText);
                }
                if (info && info.mimeType && info.videoCodec) {
                    lastVideoContentType = 'video/mp4; codecs="' + info.videoCodec + '"';
                    probe_video_capability(false);
                }
            });
            player.on(mpegts.Events.STATISTICS_INFO, function(info) {
                logStatisticsInfo(element, info);
            });
            player.on(mpegts.Events.MMTS_AUDIO_TRACKS, function(data) {
                mmtsAudioTracks = data;
                logMMTSTrackChange('audio', data);
                renderMMTSAudioTracks();
            });
            player.on(mpegts.Events.MMTS_VIDEO_TRACKS, function(data) {
                mmtsVideoTracks = data;
                logMMTSTrackChange('video', data);
                renderMMTSVideoTracks();
            });
            if (mpegts.Events.MMTS_SUBTITLE_TRACKS) {
                player.on(mpegts.Events.MMTS_SUBTITLE_TRACKS, function(data) {
                    mmtsSubtitleTracks = data;
                    logMMTSTrackChange('subtitle', data);
                    renderMMTSSubtitleTracks();
                });
            }
            if (mpegts.Events.MMTS_SUBTITLE_DATA_ARRIVED) {
                player.on(mpegts.Events.MMTS_SUBTITLE_DATA_ARRIVED, function(data) {
                    pushMMTSTTMLSubtitleData(element, data);
                });
            }
            player.load();
        }

        function prepareMediaDataSourceForNativeControls(mediaDataSource, callback) {
            if (!shouldPrepareMMTSVODMetadata(mediaDataSource)) {
                callback(mediaDataSource);
                return;
            }

            loadMediaDataSourceFileSize(mediaDataSource, function() {
                probeMediaDataSourceDuration(mediaDataSource, callback);
            });
        }

        function shouldPrepareMMTSVODMetadata(mediaDataSource) {
            return mediaDataSource &&
                mediaDataSource.type === 'mmts' &&
                mediaDataSource.isLive !== true &&
                !mediaDataSource.segments &&
                mediaDataSource.url;
        }

        function loadMediaDataSourceFileSize(mediaDataSource, callback) {
            if (hasPositiveNumber(mediaDataSource.filesize)) {
                callback(mediaDataSource);
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('HEAD', mediaDataSource.url, true);
            xhr.onload = function() {
                var length = readContentLength(xhr);
                if (length > 0) {
                    setMediaDataSourceFileSize(mediaDataSource, length);
                    callback(mediaDataSource);
                } else {
                    loadMediaDataSourceFileSizeByRange(mediaDataSource, callback);
                }
            };
            xhr.onerror = function() {
                loadMediaDataSourceFileSizeByRange(mediaDataSource, callback);
            };
            xhr.send();
        }

        function probeMediaDataSourceDuration(mediaDataSource, callback) {
            if (hasPositiveNumber(mediaDataSource.duration) ||
                !hasPositiveNumber(mediaDataSource.filesize) ||
                typeof mpegts.probeMMTSDuration !== 'function') {
                callback(mediaDataSource);
                return;
            }

            var options = {
                filesize: mediaDataSource.filesize,
                withCredentials: mediaDataSource.withCredentials === true
            };
            var mmtsVideoPacketId = parseOptionalInteger(document.getElementById('mmtsVideoPid').value);
            if (mmtsVideoPacketId != null) {
                options.videoPacketId = mmtsVideoPacketId;
            }

            logDemo('probe MMTS VOD duration...');
            mpegts.probeMMTSDuration(mediaDataSource.url, options).then(function(result) {
                if (result && hasPositiveNumber(result.duration)) {
                    setMediaDataSourceDuration(mediaDataSource, result.duration, result);
                }
                callback(mediaDataSource);
            }, function(error) {
                logDemo('MMTS VOD duration probe failed: ' + (error && error.message ? error.message : error));
                callback(mediaDataSource);
            });
        }

        function loadMediaDataSourceFileSizeByRange(mediaDataSource, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', mediaDataSource.url, true);
            xhr.setRequestHeader('Range', 'bytes=0-0');
            xhr.onload = function() {
                var length = readContentLength(xhr);
                if (length > 0) {
                    setMediaDataSourceFileSize(mediaDataSource, length);
                }
                callback(mediaDataSource);
            };
            xhr.onerror = function() {
                callback(mediaDataSource);
            };
            xhr.send();
        }

        function readContentLength(xhr) {
            var range = xhr.getResponseHeader('Content-Range');
            if (range) {
                var match = /\/(\d+)$/.exec(range);
                if (match) {
                    var total = parseInt(match[1], 10);
                    if (Number.isFinite(total) && total > 0) {
                        return total;
                    }
                }
            }

            var length = parseInt(xhr.getResponseHeader('Content-Length'), 10);
            return Number.isFinite(length) && length > 0 ? length : 0;
        }

        function hasPositiveNumber(value) {
            return typeof value === 'number' && Number.isFinite(value) && value > 0;
        }

        function setMediaDataSourceFileSize(mediaDataSource, length) {
            mediaDataSource.filesize = length;
            logDemo('MMTS VOD filesize=' + length);
        }

        function setMediaDataSourceDuration(mediaDataSource, duration, probeResult) {
            mediaDataSource.duration = duration;
            logDemo('MMTS VOD duration=' + (duration / 1000).toFixed(3) + 's' +
                ', start_offset=' + probeResult.startOffset +
                ', end_offset=' + probeResult.endOffset);
        }

        function collectStartupDebugState() {
            var element = document.getElementsByName('videoElement')[0];
            var engine = player && player._player_engine;
            var gate = engine && engine._startup_buffer_gate;
            var stateMachine = engine && engine._mse_buffer_state_machine;
            var inflightOperations = stateMachine && stateMachine._inflight_operations;
            var forwardInfo = stateMachine && element ?
                stateMachine.getForwardBufferInfo(element.currentTime) : null;
            function summarizeInflight(operation) {
                var segment = operation && operation.segment;
                return operation ? {
                    kind: operation.kind,
                    type: segment && segment.type,
                    startupGroupId: segment && segment.mseStartupGroupId,
                    startupGroupPart: segment && segment.mseStartupGroupPart
                } : null;
            }
            return {
                currentTime: element && element.currentTime,
                paused: element && element.paused,
                readyState: element && element.readyState,
                buffered: element ? formatBufferedRanges(element) : '',
                audioBuffered: formatPlayerSourceBufferRanges('audio'),
                videoBuffered: formatPlayerSourceBufferRanges('video'),
                forward: forwardInfo ? {
                    duration: forwardInfo.forwardDuration,
                    audioDuration: forwardInfo.audioForwardDuration,
                    videoDuration: forwardInfo.videoForwardDuration
                } : null,
                gate: gate ? {
                    startupGroupReleased: gate._startup_group_released,
                    released: gate._released,
                    resumeRequested: gate._resume_requested,
                    activationPlayPending: gate._activation_play_pending,
                    holdingPlayback: gate._holding_playback,
                    lastStartupJumpTarget: gate._last_startup_jump_target
                } : null,
                mse: stateMachine ? {
                    mainState: stateMachine._main_state,
                    pendingStartupGroup: !!stateMachine._pending_startup_group,
                    pendingStartupGroupId: stateMachine._pending_startup_group_id,
                    pendingStartupMedia: stateMachine._pending_startup_group_media,
                    inflight: inflightOperations ? {
                        video: summarizeInflight(inflightOperations.video),
                        audio: summarizeInflight(inflightOperations.audio)
                    } : null,
                    trackState: stateMachine._track_state,
                    pendingInit: stateMachine._pending_init_segments ? {
                        video: stateMachine._pending_init_segments.video.length,
                        audio: stateMachine._pending_init_segments.audio.length
                    } : null,
                    pendingMedia: stateMachine._pending_media_segments ? {
                        video: stateMachine._pending_media_segments.video.length,
                        audio: stateMachine._pending_media_segments.audio.length
                    } : null
                } : null
            };
        }

        function logStartupDebugState(label) {
            logDemo('startup state (' + label + '): ' + JSON.stringify(collectStartupDebugState()));
        }

        function collectAudioTrackSwitchDebugState() {
            var element = document.getElementsByName('videoElement')[0];
            var engine = player && player._player_engine;
            var coordinator = engine && engine._audio_track_switch_coordinator;
            var transaction = coordinator && coordinator.active;
            var stateMachine = engine && engine._mse_buffer_state_machine;
            var mseContext = stateMachine && stateMachine._track_switch_transaction;
            var videoWindow = engine && engine._mmts_live_video_rebuild_window;
            var mseState = engine && engine._mse_controller &&
                engine._mse_controller.getMediaSourceState ?
                engine._mse_controller.getMediaSourceState() : null;
            return {
                currentTime: element && element.currentTime,
                paused: element && element.paused,
                readyState: element && element.readyState,
                currentSrc: element && element.currentSrc,
                buffered: element ? formatBufferedRanges(element) : '',
                loadingPaused: !!(engine && engine._loading_controller &&
                    engine._loading_controller._paused),
                operation: engine && engine._active_playback_operation,
                transaction: transaction ? {
                    stage: transaction.stage,
                    transactionId: transaction.operation && transaction.operation.transactionId,
                    attempt: transaction.operation && transaction.operation.attempt,
                    requestedTime: transaction.operation &&
                        transaction.operation.requestedTimeMilliseconds / 1000,
                    priorPacketId: transaction.priorCommittedPacketId,
                    targetPacketId: transaction.targetPacketId,
                    confirmedTrackData: !!transaction.confirmedTrackData,
                    internalSelectionChanged: transaction.internalSelectionChanged,
                    selectionMayHaveMutated: transaction.selectionMayHaveMutated
                } : null,
                collection: engine ? {
                    acceptedTime: engine._accepted_audio_track_switch_time,
                    hasVideoInit: !!(engine._mse_controller &&
                        typeof engine._mse_controller.getLastInitSegment === 'function' &&
                        engine._mse_controller.getLastInitSegment('video')),
                    hasAudioInit: !!engine._pending_audio_track_switch_init_segment,
                    audioMedia: engine._pending_audio_track_switch_media_segments ?
                        engine._pending_audio_track_switch_media_segments.length : 0,
                    hasVideoWindow: !!videoWindow,
                    videoWindowStart: videoWindow && videoWindow.playableStart,
                    videoMedia: videoWindow && videoWindow.segments ?
                        videoWindow.segments.length : 0,
                    rebuildInProgress: !!engine._mmts_audio_track_switch_rebuild_in_progress
                } : null,
                mse: stateMachine ? {
                    mainState: stateMachine._main_state,
                    sourceOpened: stateMachine._source_opened,
                    pauseReason: stateMachine._transmuxer_pause_reason,
                    trackSwitchNeedsData: stateMachine._track_switch_needs_data,
                    collectionHold: stateMachine._live_audio_track_switch_collection_hold,
                    context: mseContext ? {
                        kind: mseContext.kind,
                        stage: mseContext.stage,
                        transactionId: mseContext.transactionId
                    } : null,
                    pendingRebuild: !!stateMachine._pending_audio_rebuild_plan,
                    rebuildTransactionId: stateMachine._pending_audio_rebuild_transaction_id,
                    pendingInit: stateMachine._pending_init_segments ? {
                        video: stateMachine._pending_init_segments.video.length,
                        audio: stateMachine._pending_init_segments.audio.length
                    } : null,
                    pendingMedia: stateMachine._pending_media_segments ? {
                        video: stateMachine._pending_media_segments.video.length,
                        audio: stateMachine._pending_media_segments.audio.length
                    } : null,
                    mediaSource: mseState ? {
                        readyState: mseState.readyState,
                        streaming: mseState.streaming,
                        hasFatalMediaError: mseState.hasFatalMediaError
                    } : null
                } : null
            };
        }

        function logAudioTrackSwitchDebugState(label) {
            logDemo('audio switch state (' + label + '): ' +
                JSON.stringify(collectAudioTrackSwitchDebugState()));
        }

        function player_start() {
            logStartupDebugState('before start');
            player.play();
            window.setTimeout(function() {
                logStartupDebugState('after start');
            }, 1500);
        }

        function player_pause() {
            player.pause();
        }

        function player_destroy() {
            if (bt2446cWebGPURenderer) {
                bt2446cWebGPURenderer.setEnabled(false);
            }
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
            clearTTMLSubtitleOverlay();
        }
        function set_bt2446c_webgpu_enabled() {
            var checkbox = document.getElementById('bt2446cWebGPUEnabled');
            var status = document.getElementById('bt2446cWebGPUStatus');
            var element = document.getElementsByName('videoElement')[0];
            var canvas = document.getElementById('bt2446cWebGPUCanvas');
            var mode = document.getElementById('bt2446WebGPUMode').value;
            if (!bt2446cWebGPURenderer) {
                bt2446cWebGPURenderer = new BT2446CWebGPU.Renderer(element, canvas, function(message) {
                    status.textContent = message;
                    logDemo('WebGPU HDR to SDR: ' + message);
                }, mode);
            }
            bt2446cWebGPURenderer.setMode(mode);
            bt2446cWebGPURenderer.setEnabled(checkbox.checked).catch(function(error) {
                checkbox.checked = false;
                status.textContent = 'error: ' + error.message;
                logDemo('WebGPU HDR to SDR error: ' + error.message);
            });
        }

        function set_bt2446_webgpu_mode() {
            if (bt2446cWebGPURenderer) {

        function inspectTTMLTimeline(text, timelineOffset) {
            var result = {
                minBegin: null,
                maxEnd: null,
                minRelativeBegin: null,
                maxRelativeEnd: null
            };
            if (!text || typeof DOMParser === 'undefined') {
                return result;
            }

            var doc = new DOMParser().parseFromString(text, 'application/xml');
            if (!doc || doc.getElementsByTagName('parsererror').length > 0) {
                return result;
            }

            var nodes = doc.getElementsByTagName('*');
            for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                var name = node.localName || String(node.nodeName || '').replace(/^.*:/, '');
                if (name !== 'p' && name !== 'audio') {
                    continue;
                }

                var begin = parseTTMLTimeValue(readTTMLAttr(node, 'begin'));
                var end = parseTTMLTimeValue(readTTMLAttr(node, 'end'));
                var dur = parseTTMLTimeValue(readTTMLAttr(node, 'dur'));
                var parent = node.parentNode;
                while ((begin === null || end === null || dur === null) && parent && parent.nodeType === 1) {
                    if (begin === null) {
                        begin = parseTTMLTimeValue(readTTMLAttr(parent, 'begin'));
                    }
                    if (end === null) {
                        end = parseTTMLTimeValue(readTTMLAttr(parent, 'end'));
                    }
                    if (dur === null) {
                        dur = parseTTMLTimeValue(readTTMLAttr(parent, 'dur'));
                    }
                    parent = parent.parentNode;
                }
                if (end === null && dur !== null && begin !== null) {
                    end = dur === Infinity ? Infinity : begin + dur;
                }
                if (begin !== null && (result.minBegin === null || begin < result.minBegin)) {
                    result.minBegin = begin;
                }
                if (end !== null && (result.maxEnd === null || end > result.maxEnd)) {
                    result.maxEnd = end;
                }
            }

            if (Number.isFinite(timelineOffset)) {
                result.minRelativeBegin = result.minBegin !== null ? result.minBegin + timelineOffset : null;
                result.maxRelativeEnd = result.maxEnd !== null ? result.maxEnd + timelineOffset : null;
            }
            return result;
        }

        function readTTMLAttr(node, local) {
            if (!node || !node.attributes) {
                return '';
            }
            var direct = node.getAttribute(local) || node.getAttribute('tts:' + local) || node.getAttribute('ttp:' + local);
            if (direct) {
                return direct;
            }
            for (var i = 0; i < node.attributes.length; i++) {
                if (node.attributes[i].localName === local) {
                    return node.attributes[i].value;
                }
            }
            return '';
        }

        function parseTTMLTimeValue(value) {
            if (!value) {
                return null;
            }
            var text = String(value).trim();
            if (text === 'indefinite') {
                return Infinity;
            }
            var clock = text.match(/^(\d+):(\d{2}):(\d{2})(?:\.(\d+))?$/);
            if (clock) {
                return Number(clock[1]) * 3600 + Number(clock[2]) * 60 + Number(clock[3]) + Number('0.' + (clock[4] || '0'));
            }
            var seconds = text.match(/^([0-9.]+)s$/);
            if (seconds) {
                return Number(seconds[1]);
            }
            var millis = text.match(/^([0-9.]+)ms$/);
            if (millis) {
                return Number(millis[1]) / 1000;
            }
            return null;
        }

                ranges.push(buffered.start(i).toFixed(3) + '-' + buffered.end(i).toFixed(3));

        function logStatisticsInfo(element, info) {

                currentTime: Math.floor(element.currentTime),
                readyState: element.readyState,
                loader: info && info.loaderType
            };
            var unchanged = lastStatisticsLogState &&
                lastStatisticsLogState.forward === state.forward &&
                lastStatisticsLogState.currentTime === state.currentTime &&
                lastStatisticsLogState.readyState === state.readyState &&
                lastStatisticsLogState.loader === state.loader;
            var interval = forward <= 0.05 ? 15000 : 5000;
            if (unchanged || now - lastStatisticsLogTime < interval) {
                return;
            }
            lastStatisticsLogTime = now;
            lastStatisticsLogState = state;

            logDemo('stats: speed=' + formatNumber(info && info.speed, 0) +
                'KB/s, forward=' + formatNumber(forward, 3) +
                's, currentTime=' + formatNumber(element.currentTime, 3) +
                ', readyState=' + element.readyState +

        function getForwardBufferDuration(element) {
            var current = element.currentTime;
            var buffered = element.buffered;
            for (var i = 0; i < buffered.length; i++) {
                var start = buffered.start(i);
                var end = buffered.end(i);
                if (current >= start && current <= end) {
                    return end - current;

            return 0;

        function pushMMTSTTMLSubtitleData(video, data, options) {
            options = options || {};
            if (!options.replay) {
                cacheTTMLSubtitleData(data);
            }
            if (selectedMMTSSubtitlePacketId !== null && (!data || data.packetId !== selectedMMTSSubtitlePacketId)) {
                return;
            }
            if (!ttmlSubtitleRenderer) {
                if (ttmlSubtitleRendererUnavailable) {
                    return;
                }
                setupTTMLSubtitleOverlay(video);
                if (!ttmlSubtitleRenderer) {
                    return;
                }
            }
            ttmlSubtitleRenderer.setLive(video.duration === Infinity || document.getElementById('isLive').checked);

            var result = ttmlSubtitleRenderer.push(data);
            result.resourcesComplete = data && data.resourcesComplete;
            result.dts = data && data.dts;
            result.rawPts = data && data.rawPts;
            result.rawDts = data && data.rawDts;
            result.subtitleTimingMode = data && data.subtitleTimingMode;
            result.subtitleReferenceStartTime = data && data.subtitleReferenceStartTime;
            result.subtitleReferenceStartMediaTime = data && data.subtitleReferenceStartMediaTime;
            result.videoMediaDts = data && data.videoMediaDts;
            result.videoMediaPts = data && data.videoMediaPts;
            result.videoRawDtsBase = data && data.videoRawDtsBase;
            result.videoDtsBase = data && data.videoDtsBase;
            result.videoSampleIndex = data && data.videoSampleIndex;
            result.droppedVideoSampleCount = data && data.droppedVideoSampleCount;
            cacheTTMLFontDownloads(result.fontFaces || [], data);
            ttmlSubtitleEventCount = result.eventCount;
            var timeline = inspectTTMLTimeline(result.text, result.timelineOffset);
            result.timelineDebug = timeline;
            updateTTMLSubtitleStatus(result);
            if (!options.replay) {
                logDemo('mmts subtitle data #' + result.eventCount +
                    ': packet_id=' + formatPacketId(result.packetId) +
                    ', cues=' + result.cueCount +
                    ', cached=' + ttmlSubtitleDataCache.length +
                    ', resources=' + (result.resourceCount || 0) +
                    ', resources_complete=' + (data && data.resourcesComplete ? 1 : 0) +
                    ', fonts=' + (result.fontFaceCount || 0) +
                    ', ' + formatMMTSPacketTimeline(data) +
                    ', base=' + (result.basePts !== null ? formatSeconds(result.basePts) : 'n/a') +
                    ', effective=' + (result.effectiveBasePts !== null ? formatSeconds(result.effectiveBasePts) : 'n/a') +
                    ', offset=' + (result.timelineOffset !== null ? formatSeconds(result.timelineOffset) : 'n/a') +
                    ', ttml_abs=' + formatTimelineRange(timeline.minBegin, timeline.maxEnd) +
                    ', ttml_rel=' + formatTimelineRange(timeline.minRelativeBegin, timeline.maxRelativeEnd) +
                    (result.arrivalAligned ? ', arrival-aligned' : '') +
                    ', len=' + result.len);
            }
        }

        function inject_test_ttml_subtitle() {
            var video = document.getElementsByName('videoElement')[0];
            var now = video ? video.currentTime : 0;
            var text =
                '<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling" tts:extent="3840px 2160px" xml:lang="ja">' +
                '<head>' +
                '<styling>' +
                '<style xml:id="s1" tts:fontSize="160px 160px" tts:lineHeight="200px" tts:color="#FFFFFFFF" tts:backgroundColor="#000000CC"/>' +
                '</styling>' +
                '<layout>' +
                '<region xml:id="r1" tts:origin="480px 1240px" tts:extent="2880px 420px" tts:displayAlign="center"/>' +
                '</layout>' +
                '</head>' +
                '<body><div><p region="r1" begin="00:00:00.000" end="00:00:05.000" style="s1"><span>ARIB-TTML demo 字幕テスト</span></p></div></body>' +
                '</tt>';
            pushMMTSTTMLSubtitleData(video, {
                packetId: selectedMMTSSubtitlePacketId !== null ? selectedMMTSSubtitlePacketId : 0xf338,
                pts: Math.floor(now * 1000),
                text: text,
                len: text.length
            });
        }

        function clearActiveTTMLSubtitleCues() {
            if (ttmlSubtitleRenderer) {
                ttmlSubtitleRenderer.clear();
            }
        }

        function cacheTTMLSubtitleData(data) {
            if (!data) {
                return;
            }
            ttmlSubtitleDataCache.push(data);
        }

        function resetTTMLSubtitleDataCache() {
            ttmlSubtitleDataCache = [];
            ttmlSubtitleReplayActive = false;
            ttmlCachedFontFaces.forEach(function(fontFace) {
                if (fontFace.ownedUrl && fontFace.url && typeof URL !== 'undefined' && URL.revokeObjectURL) {
                    URL.revokeObjectURL(fontFace.url);
                }
            });
            ttmlCachedFontFaces = [];
            ttmlCachedFontFaceKeys = {};
        }

        function replayCachedTTMLSubtitles() {
            if (ttmlSubtitleReplayActive || !ttmlSubtitleRenderer || ttmlSubtitleDataCache.length === 0) {
                return;
            }
            var video = document.getElementsByName('videoElement')[0];
            ttmlSubtitleReplayActive = true;
            clearActiveTTMLSubtitleCues();
            for (var i = 0; i < ttmlSubtitleDataCache.length; i++) {
                pushMMTSTTMLSubtitleData(video, ttmlSubtitleDataCache[i], { replay: true });
            }
            ttmlSubtitleReplayActive = false;
            logDemo('replayed cached TTML payloads: count=' + ttmlSubtitleDataCache.length);
            renderTTMLSubtitleStatus();
        }

        function cacheTTMLFontDownloads(fontFaces, data) {
            fontFaces.forEach(function(fontFace) {
                var key = [
                    data && data.packetId,
                    data && data.mpuSequenceNumber,
                    fontFace.resourceIndex,
                    fontFace.family,
                    fontFace.format,
                    fontFace.unicodeRange,
                    fontFace.src
                ].join('|');
                if (ttmlCachedFontFaceKeys[key]) {
                    return;
                }

                var cached = {
                    family: fontFace.family || '',
                    format: fontFace.format || '',
                    unicodeRange: fontFace.unicodeRange || '',
                    src: fontFace.src || '',
                    resourceIndex: fontFace.resourceIndex,
                    downloadName: fontFace.downloadName || '',
                    url: fontFace.url || '',
                    ownedUrl: false
                };
                var resource = findTTMLResourceByIndex(data, fontFace.resourceIndex);
                var bytes = resource ? toUint8Array(resource.data || resource.payload || resource.bytes) : null;
                if (bytes && typeof Blob !== 'undefined' && typeof URL !== 'undefined' && URL.createObjectURL) {
                    cached.url = URL.createObjectURL(new Blob([bytes], { type: mimeTypeForFontFormat(cached.format) }));
                    cached.ownedUrl = true;
                }
                if (!cached.url) {
                    return;
                }

                ttmlCachedFontFaceKeys[key] = true;
                ttmlCachedFontFaces.push(cached);
            });
        }

        function findTTMLResourceByIndex(data, index) {
            if (!data || !Number.isFinite(index)) {
                return null;
            }
            var lists = [data.resources, data.subsamples];
            for (var i = 0; i < lists.length; i++) {
                var list = lists[i];
                if (!Array.isArray(list)) {
                    continue;
                }
                for (var j = 0; j < list.length; j++) {
                    var item = list[j];
                    if (Number(firstDefined(
                        item && item.index,
                        item && item.subsampleIndex,
                        item && item.subsampleNumber,
                        item && item.subsample,
                        item && item.id
                    )) === index) {
                        return item;
                    }
                }
            }
            var maps = [data.resourceMap, data.resourcesBySubsample];
            for (var k = 0; k < maps.length; k++) {
                var map = maps[k];
                if (!map || typeof map !== 'object') {
                    continue;
                }
                if (map[index] !== undefined) {
                    var value = map[index];
                    return typeof value === 'object' && !(value instanceof Uint8Array) && !(value instanceof ArrayBuffer) ?
                        value :
                        { index: index, data: value };
                }
            }
            return null;
        }

        function firstDefined() {
            for (var i = 0; i < arguments.length; i++) {
                if (arguments[i] !== undefined && arguments[i] !== null) {
                    return arguments[i];
                }
            }
            return undefined;
        }

        function toUint8Array(data) {
            if (!data) {
                return null;
            }
            if (data instanceof Uint8Array) {
                return data;
            }
            if (data instanceof ArrayBuffer) {
                return new Uint8Array(data);
            }
            if (Array.isArray(data)) {
                return new Uint8Array(data);
            }
            return null;
        }

        function mimeTypeForFontFormat(format) {
            switch (String(format || '').toLowerCase()) {
                case 'svg':
                    return 'image/svg+xml';
                case 'woff':
                    return 'font/woff';
                default:
                    return 'application/octet-stream';
            }
        }

        function updateTTMLSubtitleStatus(result) {
            ttmlSubtitleLastStatus = result;
            renderTTMLSubtitleStatus();
        }

        function renderTTMLSubtitleStatus() {
            var container = document.getElementById('ttmlSubtitleStatus');
            if (!container) {
                return;
            }
            if (!ttmlSubtitleLastStatus) {
                container.textContent = 'TTML payload events=' + ttmlSubtitleEventCount + '  selected=' + (selectedMMTSSubtitlePacketId === null ? 'all' : formatPacketId(selectedMMTSSubtitlePacketId));
                renderTTMLFontDownloads(null);
                return;
            }

            var status = ttmlSubtitleLastStatus;
            var parts = [
                'TTML payload events=' + ttmlSubtitleEventCount,
                'selected=' + (selectedMMTSSubtitlePacketId === null ? 'all' : formatPacketId(selectedMMTSSubtitlePacketId)),
                'last_packet=' + formatPacketId(status.packetId),
                'cues=' + status.cueCount,
                'cached=' + ttmlSubtitleDataCache.length,
                'resources=' + (status.resourceCount || 0),
                'resources_complete=' + (status.resourcesComplete ? 1 : 0),
                'fonts=' + (status.fontFaceCount || 0),
                'pts=' + (status.pts !== undefined ? status.pts : 'n/a'),
                'base=' + (status.basePts !== null ? formatNumber(status.basePts, 3) : 'n/a'),
                'effective=' + (status.effectiveBasePts !== null ? formatNumber(status.effectiveBasePts, 3) : 'n/a'),
                'offset=' + (status.timelineOffset !== null ? formatNumber(status.timelineOffset, 3) : 'n/a'),
                'len=' + status.len
            ];
            if (status.arrivalAligned) {
                parts.push('arrival-aligned');
            }
            if (status.timelineDebug) {
                parts.push('pkt_rel=' + formatMsSeconds(status.pts) + '/' + formatMsSeconds(status.dts));
                parts.push('pkt_abs=' + formatMsSeconds(status.rawPts) + '/' + formatMsSeconds(status.rawDts));
                parts.push('tmd=' + (status.subtitleTimingMode !== undefined ? status.subtitleTimingMode : 'n/a'));
                parts.push('ref_start=' + formatMsSeconds(status.subtitleReferenceStartTime));
                parts.push('ref_media=' + formatMsSeconds(status.subtitleReferenceStartMediaTime));
                parts.push('video_media=' + formatMsSeconds(status.videoMediaDts) + '/' + formatMsSeconds(status.videoMediaPts));
                parts.push('video_base=' + formatMsSeconds(status.videoRawDtsBase) + '/' + formatMsSeconds(status.videoDtsBase));
                parts.push('video_samples=' + (status.videoSampleIndex !== undefined ? status.videoSampleIndex : 'n/a'));
                parts.push('dropped_video=' + (status.droppedVideoSampleCount !== undefined ? status.droppedVideoSampleCount : 'n/a'));
                parts.push('ttml_abs=' + formatTimelineRange(status.timelineDebug.minBegin, status.timelineDebug.maxEnd));
                parts.push('ttml_rel=' + formatTimelineRange(status.timelineDebug.minRelativeBegin, status.timelineDebug.maxRelativeEnd));
            }
            container.textContent = parts.join('  ') +
                (status.preview ? '\npreview=' + status.preview : '') +
                (status.previewCodePoints ? '\ncodepoints=' + status.previewCodePoints : '');
            renderTTMLFontDownloads(ttmlCachedFontFaces);
        }

        function renderTTMLFontDownloads(fontFaces) {
            var container = document.getElementById('ttmlFontDownloads');
            if (!container) {
                return;
            }
            container.innerHTML = '';
            if (!fontFaces || fontFaces.length === 0) {
                container.textContent = 'No TTML fonts';
                return;
            }

            var title = document.createElement('div');
            title.textContent = 'TTML font downloads';
            container.appendChild(title);
            fontFaces.forEach(function(fontFace, index) {
                var link = document.createElement('a');
                link.href = fontFace.url;
                link.download = fontFace.downloadName || ('aribb62-font-' + index + '.' + (fontFace.format || 'bin'));
                link.textContent = [
                    'font ' + index,
                    fontFace.format || 'unknown',
                    fontFace.unicodeRange || 'all',
                    fontFace.family || '',
                    fontFace.downloadName || ''
                ].filter(Boolean).join('  ');
                container.appendChild(link);
            });
        }

        function formatPacketId(packetId) {
            return Number.isFinite(packetId) ? '0x' + Number(packetId).toString(16) : 'n/a';
        }

        function probe_video_capability(force) {
            if (force !== false) {
                force = true;
            }
            var contentType = lastVideoContentType;
            var element = document.getElementsByName('videoElement')[0];
            var width = lastMediaInfo && lastMediaInfo.width || 7680;
            var height = lastMediaInfo && lastMediaInfo.height || 4320;
            var framerate = lastMediaInfo && lastMediaInfo.fps || 60;
            var probeKey = contentType + '|' + width + 'x' + height + '|' + framerate;
            if (!force && probeKey === lastCapabilityProbeKey) {
                return;
            }
            lastCapabilityProbeKey = probeKey;
            logDemo('canPlayType(' + contentType + ')=' + element.canPlayType(contentType));
            if (!navigator.mediaCapabilities || !navigator.mediaCapabilities.decodingInfo) {
                logDemo('mediaCapabilities.decodingInfo unavailable');
                return;
            }
            navigator.mediaCapabilities.decodingInfo({
                type: 'media-source',
                video: {
                    contentType: contentType,
                    width: width,
                    height: height,
                    bitrate: 80000000,
                    framerate: framerate
                }
            }).then(function(info) {
                logDemo('mediaCapabilities: ' + JSON.stringify(info));
            }).catch(function(error) {
                logDemo('mediaCapabilities error: ' + error.message);
            });
        }

        function probe_video_frame_color_space() {
            var element = document.getElementsByName('videoElement')[0];
            if (typeof VideoFrame === 'undefined') {
                logDemo('VideoFrame API unavailable.');
                return;
            }
            try {
                var frame = new VideoFrame(element);
                var colorSpace = frame.colorSpace && frame.colorSpace.toJSON ?
                    frame.colorSpace.toJSON() : frame.colorSpace;
                logDemo('VideoFrame color: ' + JSON.stringify({
                    format: frame.format,
                    codedWidth: frame.codedWidth,
                    codedHeight: frame.codedHeight,
                    colorSpace: colorSpace,
                }));
                frame.close();
            } catch (error) {
                logDemo('VideoFrame color probe error: ' + error.message);
            }
        }

        function switch_url() {
            streamURL.className = '';
            mediaSourceURL.className = 'hidden';
            saveSettings();
        }

        function switch_mds() {
            streamURL.className = 'hidden';
            mediaSourceURL.className = '';
            saveSettings();
        }

        function ls_get(key, def) {
            try {
                var ret = localStorage.getItem('mpegts_demo.' + key);
                if (ret === null) {
                    ret = def;
                }
                return ret;
            } catch (e) {}
            return def;
        }

        function ls_set(key, value) {
            try {
                localStorage.setItem('mpegts_demo.' + key, value);
            } catch (e) {}
        }

        function saveSettings() {
            if (mediaSourceURL.className === '') {
                ls_set('inputMode', 'MediaDataSource');
            } else {
                ls_set('inputMode', 'StreamURL');
            }
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                ls_set(field, checkbox.checked ? '1' : '0');
            }
            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            var mmtsVideoPid = document.getElementById('mmtsVideoPid');
            ls_set('mediaType', mediaType.value);
            ls_set('msURL', msURL.value);
            ls_set('sURL', sURL.value);
            ls_set('mmtsVideoPid', mmtsVideoPid.value);
            console.log('save');
        }

        function loadSettings() {
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                var c = ls_get(field, checkbox.checked ? '1' : '0');
                checkbox.checked = c === '1' ? true : false;
            }

            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            var mmtsVideoPid = document.getElementById('mmtsVideoPid');
            mediaType.value = ls_get('mediaType', mediaType.value);
            msURL.value = ls_get('msURL', msURL.value);
            sURL.value = ls_get('sURL', sURL.value);
            mmtsVideoPid.value = ls_get('mmtsVideoPid', mmtsVideoPid.value);
            if (sURL.value === '../sample/BS17_0.mmts') {
                sURL.value = 'BS17_0.mmts';
            }
            if (ls_get('inputMode', 'StreamURL') === 'StreamURL') {
                switch_url();
            } else {
                switch_mds();
            }
        }

        function showVersion() {
            var version = mpegts.version;
            document.title = document.title + " (v" + version + ")";
        }

        var sURL = document.getElementById('sURL');
        sURL.onkeyup = function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                saveSettings()
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
                player_load();
            }
        };

        mpegts.LoggingControl.enableVerbose = false;
        mpegts.LoggingControl.enableDebug = false;
        mpegts.LoggingControl.addLogListener(function(type, str) {
            if (shouldLogLibraryLine(type, str)) {
                appendLogcatLine(str);
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            streamURL = document.getElementById('streamURL');
            mediaSourceURL = document.getElementById('mediaSourceURL');
            loadSettings();
            showVersion();
            player_load();
            if (document.getElementById('bt2446cWebGPUEnabled').checked) {
                set_bt2446c_webgpu_enabled();
            }
        });
    </script>
    
</body>

</html>
