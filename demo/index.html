<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>mpegts.js demo</title>
    <link rel="stylesheet" type="text/css" href="demo.css" />
</head>

<body>
    
    <div class="mainContainer">
        <div>
            <div id="streamURL">
                <div class="url-input">
                    <label for="sURL">Stream URL:</label>
                    <input id="sURL" type="text" value="BS17_0.mmts" onchange="saveSettings()" />
                    <button onclick="switch_mds()">Switch to MediaDataSource</button>
                </div>
                <div class="options">
                    <label for="mediaType">type</label>
                    <select id="mediaType" onchange="saveSettings()">
                        <option value="m2ts">m2ts</option>
                        <option value="mmts" selected>mmts</option>
                        <option value="mpegts">mpegts</option>
                        <option value="mse">mse</option>
                        <option value="flv">flv</option>
                    </select>
                    <input type="checkbox" id="isLive" onchange="saveSettings()" checked />
                    <label for="isLive">isLive</label>
                    <input type="checkbox" id="withCredentials" onchange="saveSettings()" />
                    <label for="withCredentials">withCredentials</label>
                    <input type="checkbox" id="liveBufferLatencyChasing" onchange="saveSettings()" />
                    <label for="liveBufferLatencyChasing">liveBufferLatencyChasing</label>
                    <label for="mmtsVideoPid">MMTS video PID</label>
                    <input id="mmtsVideoPid" type="text" value="" placeholder="auto / 0xf101" onchange="saveSettings()" style="width:120px" />
                </div>
            </div>
            <div id="mediaSourceURL" class="hidden">
                <div class="url-input">
                    <label for="msURL">MediaDataSource JsonURL:</label>
                    <input id="msURL" type="text" value="http://127.0.0.1/flv/7182741.json" onchange="saveSettings()" />
                    <button onclick="switch_url()">Switch to URL</button>
                </div>
            </div>
        </div>
        <div class="video-container">
            <div>
                <video name="videoElement" class="centeredVideo" controls autoplay playsinline>
                    Your browser is too old which doesn't support HTML5 video.
                </video>
                <div id="ttmlSubtitleOverlay" class="ttml-subtitle-overlay"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="player_load()">Load</button>
            <button onclick="player_start()">Start</button>
            <button onclick="player_pause()">Pause</button>
            <button onclick="player_destroy()">Destroy</button>
            <input style="width:100px" type="text" name="seekpoint"/>
            <button onclick="player_seekto()">SeekTo</button>
            <button onclick="player_switch_primary_audio()">Primary Audio</button>
            <button onclick="player_switch_secondary_audio()">Next Audio</button>
            <button onclick="probe_video_capability()">Probe Codec</button>
            <button onclick="inject_test_ttml_subtitle()">Test TTML</button>
        </div>
        <div class="track-panel">
            <div class="track-title">Video info</div>
            <div id="videoInfo" class="track-list">No video info</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS video tracks</div>
            <div id="mmtsVideoTracks" class="track-list">No MMTS video tracks</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS audio tracks</div>
            <div id="mmtsAudioTracks" class="track-list">No MMTS audio tracks</div>
        </div>
        <div class="track-panel">
            <div class="track-title">MMTS subtitle tracks</div>
            <div id="mmtsSubtitleTracks" class="track-list">No MMTS subtitle tracks</div>
            <div id="ttmlSubtitleStatus" class="track-list ttml-subtitle-status">TTML payload events=0</div>
            <div id="ttmlFontDownloads" class="track-list ttml-font-downloads">No TTML fonts</div>
        </div>
        <textarea name="logcatbox" class="logcatBox" rows="10"></textarea>
    </div>

    <script src="../dist/mpegts.js"></script>
    <script type="module">
        import * as aribb62js from '../../aribb62.js/src/index.js';
        window.aribb62js = aribb62js;
    </script>
    
    <script>
        var checkBoxFields = ['isLive', 'withCredentials', 'liveBufferLatencyChasing'];
        var streamURL, mediaSourceURL;
        var mmtsAudioTracks = null;
        var mmtsVideoTracks = null;
        var mmtsSubtitleTracks = null;
        var lastMediaInfo = null;
        var lastVideoContentType = 'video/mp4; codecs="hvc1.2.1.L183.B0"';
        var ttmlSubtitleRenderer = null;
        var ttmlSubtitleEventCount = 0;
        var ttmlSubtitleLastStatus = null;
        var ttmlSubtitleDataCache = [];
        var ttmlSubtitleReplayActive = false;
        var ttmlCachedFontFaces = [];
        var ttmlCachedFontFaceKeys = {};
        var selectedMMTSSubtitlePacketId = null;

        function logDemo(message) {
            var box = document.getElementsByName('logcatbox')[0];
            if (box) {
                box.value = box.value + '[demo] ' + message + '\n';
                box.scrollTop = box.scrollHeight;
            }
            console.log('[demo] ' + message);
        }

        function player_load() {
            console.log('isSupported: ' + mpegts.isSupported());
            saveSettings();
            if (mediaSourceURL.className === '') {
                var url = document.getElementById('msURL').value;
    
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function (e) {
                    var mediaDataSource = JSON.parse(xhr.response);
                    player_load_mds(mediaDataSource);
                }
                xhr.send();
            } else {
                var i;
                var mediaDataSource = {
                    type: document.getElementById('mediaType').value
                };
                for (i = 0; i < checkBoxFields.length; i++) {
                    var field = checkBoxFields[i];
                    /** @type {HTMLInputElement} */
                    var checkbox = document.getElementById(field);
                    mediaDataSource[field] = checkbox.checked;
                }
                mediaDataSource['url'] = new URL(document.getElementById('sURL').value, window.location.href).href;
                console.log('MediaDataSource', mediaDataSource);
                player_load_mds(mediaDataSource);
            }
        }

        function player_load_mds(mediaDataSource) {
            var element = document.getElementsByName('videoElement')[0];
            if (typeof player !== "undefined") {
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
            }
            var config = {
                enableWorker: true,
                lazyLoadMaxDuration: 3 * 60,
                seekType: 'range',
                liveBufferLatencyChasing: document.getElementById('liveBufferLatencyChasing').checked,
            };
            var mmtsVideoPacketId = parseOptionalInteger(document.getElementById('mmtsVideoPid').value);
            if (mmtsVideoPacketId != null && mediaDataSource.type === 'mmts') {
                config.mmtsVideoPacketId = mmtsVideoPacketId;
                logDemo('force MMTS video packet_id=0x' + mmtsVideoPacketId.toString(16));
            } else if (mmtsVideoPacketId != null) {
                logDemo('ignore MMTS video packet_id for type=' + mediaDataSource.type);
            }
            player = mpegts.createPlayer(mediaDataSource, config);
            setupMediaElementDebug(element);
            player.attachMediaElement(element);
            setupTTMLSubtitleOverlay(element);
            resetVideoInfo();
            resetMMTSVideoTracks();
            resetMMTSAudioTracks();
            resetMMTSSubtitleTracks();
            player.on(mpegts.Events.ERROR, function(type, detail, info) {
                logDemo('mpegts error: type=' + type + ', detail=' + detail + ', info=' + JSON.stringify(info || null));
            });
            player.on(mpegts.Events.MEDIA_INFO, function(info) {
                lastMediaInfo = info || null;
                renderVideoInfo();
                logDemo('media info: ' + JSON.stringify(info));
                if (info && info.mimeType && info.videoCodec) {
                    lastVideoContentType = 'video/mp4; codecs="' + info.videoCodec + '"';
                    probe_video_capability();
                }
            });
            player.on(mpegts.Events.MMTS_AUDIO_TRACKS, function(data) {
                mmtsAudioTracks = data;
                logDemo('mmts audio tracks: ' + JSON.stringify(data));
                renderMMTSAudioTracks();
            });
            player.on(mpegts.Events.MMTS_VIDEO_TRACKS, function(data) {
                mmtsVideoTracks = data;
                logDemo('mmts video tracks: ' + JSON.stringify(data));
                renderMMTSVideoTracks();
            });
            if (mpegts.Events.MMTS_SUBTITLE_TRACKS) {
                player.on(mpegts.Events.MMTS_SUBTITLE_TRACKS, function(data) {
                    mmtsSubtitleTracks = data;
                    logDemo('mmts subtitle tracks: ' + JSON.stringify(data));
                    renderMMTSSubtitleTracks();
                });
            }
            if (mpegts.Events.MMTS_SUBTITLE_DATA_ARRIVED) {
                player.on(mpegts.Events.MMTS_SUBTITLE_DATA_ARRIVED, function(data) {
                    pushMMTSTTMLSubtitleData(element, data);
                });
            }
            player.load();
        }

        function player_start() {
            player.play();
        }

        function player_pause() {
            player.pause();
        }

        function player_destroy() {
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
            player = null;
            clearTTMLSubtitleOverlay();
        }

        function player_seekto() {
            var input = document.getElementsByName('seekpoint')[0];
            player.currentTime = parseFloat(input.value);
        }

        function player_switch_primary_audio() {
            if (player != null && player.switchPrimaryAudio) {
                player.switchPrimaryAudio();
            }
        }

        function player_switch_secondary_audio() {
            if (player != null && player.switchSecondaryAudio) {
                player.switchSecondaryAudio();
            }
        }

        function resetVideoInfo() {
            lastMediaInfo = null;
            renderVideoInfo();
        }

        function renderVideoInfo() {
            var container = document.getElementById('videoInfo');
            if (!container) {
                return;
            }

            var element = document.getElementsByName('videoElement')[0];
            var parts = [];
            if (lastMediaInfo) {
                if (lastMediaInfo.width && lastMediaInfo.height) {
                    parts.push('media=' + lastMediaInfo.width + 'x' + lastMediaInfo.height);
                }
                if (lastMediaInfo.fps) {
                    parts.push('fps=' + formatNumber(lastMediaInfo.fps, 3));
                }
                if (lastMediaInfo.videoCodec) {
                    parts.push('video=' + lastMediaInfo.videoCodec);
                }
                if (lastMediaInfo.audioCodec) {
                    parts.push('audio=' + lastMediaInfo.audioCodec);
                }
                if (lastMediaInfo.audioChannelCount) {
                    parts.push('audio_ch=' + lastMediaInfo.audioChannelCount);
                }
            }
            if (element && element.videoWidth && element.videoHeight) {
                parts.push('element=' + element.videoWidth + 'x' + element.videoHeight);
            }
            if (element && element.duration) {
                parts.push('duration=' + element.duration);
            }

            container.textContent = parts.length ? parts.join('  ') : 'No video info';
        }

        function resetMMTSVideoTracks() {
            mmtsVideoTracks = null;
            renderMMTSVideoTracks();
        }

        function renderMMTSVideoTracks() {
            var container = document.getElementById('mmtsVideoTracks');
            if (!container) {
                return;
            }
            if (!mmtsVideoTracks || !mmtsVideoTracks.tracks || mmtsVideoTracks.tracks.length === 0) {
                container.textContent = 'No MMTS video tracks';
                return;
            }

            container.innerHTML = '';
            var summary = document.createElement('div');
            summary.textContent =
                'selected=' + (mmtsVideoTracks.selectedRole || 'unknown') +
                ' fallback=' + (mmtsVideoTracks.fallback ? 'yes' : 'no') +
                ' primary=' + (mmtsVideoTracks.hasPrimary ? (mmtsVideoTracks.primaryActive ? 'active' : 'inactive') : 'missing') +
                ' secondary=' + (mmtsVideoTracks.hasSecondary ? (mmtsVideoTracks.secondaryActive ? 'active' : 'inactive') : 'missing');
            container.appendChild(summary);
            mmtsVideoTracks.tracks.forEach(function(track) {
                var item = document.createElement('div');
                item.className = 'track-item' + (track.selected ? ' selected' : '');
                item.textContent = formatMMTSVideoTrack(track);
                item.onclick = function() {
                    player_select_video_track(track.packetId);
                };
                container.appendChild(item);
            });
        }

        function formatMMTSVideoTrack(track) {
            var parts = [];
            parts.push(track.selected ? '*' : ' ');
            parts.push(track.active ? 'active' : 'inactive');
            parts.push('packet_id=0x' + Number(track.packetId).toString(16));
            if (track.resolutionLabel) {
                parts.push(track.resolutionLabel);
            }
            if (track.role) {
                parts.push(track.role);
            }
            if (track.language) {
                parts.push(track.language);
            }
            if (track.assetGroupId !== undefined) {
                parts.push('group=' + track.assetGroupId);
            }
            if (track.assetSelectionLevel !== undefined) {
                parts.push('sel=' + track.assetSelectionLevel);
            }
            appendMMTSAssetControlInfo(parts, track);
            if (track.hierarchyChannel !== undefined) {
                parts.push('hchan=' + track.hierarchyChannel);
            }
            if (track.hierarchyLayerIndex !== undefined) {
                parts.push('hlayer=' + track.hierarchyLayerIndex);
            }
            if (track.hierarchyEmbeddedLayerIndex !== undefined) {
                parts.push('base=' + track.hierarchyEmbeddedLayerIndex);
            }
            if (track.assetType) {
                parts.push(track.assetType);
            }
            return parts.join(' ');
        }

        function appendMMTSAssetControlInfo(parts, track) {
            if (track.accessControlCaSystemId !== undefined) {
                parts.push('ca=0x' + Number(track.accessControlCaSystemId).toString(16));
            }
            if (track.accessControlPacketId !== undefined) {
                parts.push('ca_pid=0x' + Number(track.accessControlPacketId).toString(16));
            }
            if (track.scrambleSystemId !== undefined) {
                parts.push('scr=' + formatMMTSScrambleSystem(track.scrambleSystemId));
            }
            if (track.messageAuthenticationSystemId !== undefined) {
                parts.push('auth=0x' + Number(track.messageAuthenticationSystemId).toString(16));
            }
        }

        function formatMMTSScrambleSystem(systemId) {
            switch (systemId) {
                case 0x01:
                    return 'aes';
                case 0x02:
                    return 'camellia';
                default:
                    return '0x' + Number(systemId).toString(16);
            }
        }

        function formatNumber(value, digits) {
            if (!Number.isFinite(value)) {
                return String(value);
            }
            return Number(value).toFixed(digits).replace(/0+$/, '').replace(/\.$/, '');
        }

        function formatSeconds(value) {
            return Number.isFinite(value) ? formatNumber(value, 3) + 's' : 'n/a';
        }

        function formatMsSeconds(value) {
            return Number.isFinite(value) ? formatSeconds(value / 1000) : 'n/a';
        }

        function formatTimelineRange(start, end) {
            return formatSeconds(start) + '..' + formatSeconds(end);
        }

        function formatMMTSPacketTimeline(data) {
            data = data || {};
            return 'pkt_rel pts/dts=' + formatMsSeconds(data.pts) + '/' + formatMsSeconds(data.dts) +
                ' pkt_abs rawPts/rawDts=' + formatMsSeconds(data.rawPts) + '/' + formatMsSeconds(data.rawDts) +
                ' tmd=' + (data.subtitleTimingMode !== undefined ? data.subtitleTimingMode : 'n/a') +
                ' ref_start=' + formatMsSeconds(data.subtitleReferenceStartTime) +
                ' ref_media=' + formatMsSeconds(data.subtitleReferenceStartMediaTime) +
                ' video_media dts/pts=' + formatMsSeconds(data.videoMediaDts) + '/' + formatMsSeconds(data.videoMediaPts) +
                ' video_base raw/dts=' + formatMsSeconds(data.videoRawDtsBase) + '/' + formatMsSeconds(data.videoDtsBase) +
                ' video_samples=' + (data.videoSampleIndex !== undefined ? data.videoSampleIndex : 'n/a') +
                ' dropped_video=' + (data.droppedVideoSampleCount !== undefined ? data.droppedVideoSampleCount : 'n/a');
        }

        function inspectTTMLTimeline(text, timelineOffset) {
            var result = {
                minBegin: null,
                maxEnd: null,
                minRelativeBegin: null,
                maxRelativeEnd: null
            };
            if (!text || typeof DOMParser === 'undefined') {
                return result;
            }

            var doc = new DOMParser().parseFromString(text, 'application/xml');
            if (!doc || doc.getElementsByTagName('parsererror').length > 0) {
                return result;
            }

            var nodes = doc.getElementsByTagName('*');
            for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                var name = node.localName || String(node.nodeName || '').replace(/^.*:/, '');
                if (name !== 'p' && name !== 'audio') {
                    continue;
                }

                var begin = parseTTMLTimeValue(readTTMLAttr(node, 'begin'));
                var end = parseTTMLTimeValue(readTTMLAttr(node, 'end'));
                var dur = parseTTMLTimeValue(readTTMLAttr(node, 'dur'));
                var parent = node.parentNode;
                while ((begin === null || end === null || dur === null) && parent && parent.nodeType === 1) {
                    if (begin === null) {
                        begin = parseTTMLTimeValue(readTTMLAttr(parent, 'begin'));
                    }
                    if (end === null) {
                        end = parseTTMLTimeValue(readTTMLAttr(parent, 'end'));
                    }
                    if (dur === null) {
                        dur = parseTTMLTimeValue(readTTMLAttr(parent, 'dur'));
                    }
                    parent = parent.parentNode;
                }
                if (end === null && dur !== null && begin !== null) {
                    end = dur === Infinity ? Infinity : begin + dur;
                }
                if (begin !== null && (result.minBegin === null || begin < result.minBegin)) {
                    result.minBegin = begin;
                }
                if (end !== null && (result.maxEnd === null || end > result.maxEnd)) {
                    result.maxEnd = end;
                }
            }

            if (Number.isFinite(timelineOffset)) {
                result.minRelativeBegin = result.minBegin !== null ? result.minBegin + timelineOffset : null;
                result.maxRelativeEnd = result.maxEnd !== null ? result.maxEnd + timelineOffset : null;
            }
            return result;
        }

        function readTTMLAttr(node, local) {
            if (!node || !node.attributes) {
                return '';
            }
            var direct = node.getAttribute(local) || node.getAttribute('tts:' + local) || node.getAttribute('ttp:' + local);
            if (direct) {
                return direct;
            }
            for (var i = 0; i < node.attributes.length; i++) {
                if (node.attributes[i].localName === local) {
                    return node.attributes[i].value;
                }
            }
            return '';
        }

        function parseTTMLTimeValue(value) {
            if (!value) {
                return null;
            }
            var text = String(value).trim();
            if (text === 'indefinite') {
                return Infinity;
            }
            var clock = text.match(/^(\d+):(\d{2}):(\d{2})(?:\.(\d+))?$/);
            if (clock) {
                return Number(clock[1]) * 3600 + Number(clock[2]) * 60 + Number(clock[3]) + Number('0.' + (clock[4] || '0'));
            }
            var seconds = text.match(/^([0-9.]+)s$/);
            if (seconds) {
                return Number(seconds[1]);
            }
            var millis = text.match(/^([0-9.]+)ms$/);
            if (millis) {
                return Number(millis[1]) / 1000;
            }
            return null;
        }

        function resetMMTSAudioTracks() {
            mmtsAudioTracks = null;
            renderMMTSAudioTracks();
        }

        function renderMMTSAudioTracks() {
            var container = document.getElementById('mmtsAudioTracks');
            if (!container) {
                return;
            }
            if (!mmtsAudioTracks || !mmtsAudioTracks.tracks || mmtsAudioTracks.tracks.length === 0) {
                container.textContent = 'No MMTS audio tracks';
                return;
            }

            container.innerHTML = '';
            mmtsAudioTracks.tracks.forEach(function(track) {
                var item = document.createElement('div');
                item.className = 'track-item' + (track.selected ? ' selected' : '');
                item.textContent = formatMMTSAudioTrack(track);
                item.onclick = function() {
                    player_select_audio_track(track.packetId);
                };
                container.appendChild(item);
            });
        }

        function formatMMTSAudioTrack(track) {
            var parts = [];
            parts.push(track.selected ? '*' : ' ');
            parts.push('packet_id=0x' + Number(track.packetId).toString(16));
            if (track.language) {
                parts.push(track.language);
            }
            if (track.assetGroupId !== undefined) {
                parts.push('group=' + track.assetGroupId);
            }
            if (track.assetSelectionLevel !== undefined) {
                parts.push('sel=' + track.assetSelectionLevel);
            }
            if (track.channelLayout) {
                parts.push(track.channelLayout);
            } else if (track.channelCount) {
                parts.push(track.channelCount + 'ch');
            }
            if (track.audioSampleRate) {
                parts.push(track.audioSampleRate + 'Hz');
            }
            if (track.componentType !== undefined) {
                parts.push('component=0x' + Number(track.componentType).toString(16));
            }
            appendMMTSAssetControlInfo(parts, track);
            return parts.join(' ');
        }

        function resetMMTSSubtitleTracks() {
            mmtsSubtitleTracks = null;
            selectedMMTSSubtitlePacketId = null;
            renderMMTSSubtitleTracks();
        }

        function renderMMTSSubtitleTracks() {
            var container = document.getElementById('mmtsSubtitleTracks');
            if (!container) {
                return;
            }
            if (!mmtsSubtitleTracks || !mmtsSubtitleTracks.tracks || mmtsSubtitleTracks.tracks.length === 0) {
                container.textContent = 'No MMTS subtitle tracks';
                return;
            }

            container.innerHTML = '';
            var summary = document.createElement('div');
            summary.className = 'track-item' + (selectedMMTSSubtitlePacketId === null ? ' selected' : '');
            summary.textContent = (selectedMMTSSubtitlePacketId === null ? '* ' : '') + 'selected=all';
            summary.onclick = function() {
                player_select_subtitle_track(null);
            };
            container.appendChild(summary);
            mmtsSubtitleTracks.tracks.forEach(function(track) {
                var item = document.createElement('div');
                item.className = 'track-item' + (track.packetId === selectedMMTSSubtitlePacketId ? ' selected' : '');
                item.textContent = (track.packetId === selectedMMTSSubtitlePacketId ? '* ' : '  ') + formatMMTSSubtitleTrack(track);
                item.onclick = function() {
                    player_select_subtitle_track(track.packetId);
                };
                container.appendChild(item);
            });
        }

        function formatMMTSSubtitleTrack(track) {
            var parts = [];
            parts.push('packet_id=0x' + Number(track.packetId).toString(16));
            if (track.language) {
                parts.push(track.language);
            }
            if (track.codec) {
                parts.push(track.codec);
            }
            if (track.assetType) {
                parts.push(track.assetType);
            }
            if (track.assetGroupId !== undefined) {
                parts.push('group=' + track.assetGroupId);
            }
            if (track.componentTag !== undefined) {
                parts.push('component=0x' + Number(track.componentTag).toString(16));
            }
            if (track.subtitleOperationMode !== undefined) {
                parts.push('opm=' + track.subtitleOperationMode);
            }
            if (track.subtitleTimingMode !== undefined) {
                parts.push('tmd=' + track.subtitleTimingMode);
            }
            if (track.subtitleReferenceStartTime !== undefined) {
                parts.push('ref=' + formatMsSeconds(track.subtitleReferenceStartTime));
            }
            appendMMTSAssetControlInfo(parts, track);
            return parts.join(' ');
        }

        function player_select_subtitle_track(packetId) {
            if (packetId === selectedMMTSSubtitlePacketId) {
                selectedMMTSSubtitlePacketId = null;
                logDemo('select MMTS subtitle packet_id=all');
            } else {
                selectedMMTSSubtitlePacketId = packetId;
                logDemo('select MMTS subtitle packet_id=' + formatPacketId(packetId));
            }
            clearActiveTTMLSubtitleCues();
            renderMMTSSubtitleTracks();
            replayCachedTTMLSubtitles();
            renderTTMLSubtitleStatus();
        }

        function player_select_audio_track(packetId) {
            if (player != null && player.selectAudioTrack) {
                player.selectAudioTrack(packetId);
            }
        }

        function player_select_video_track(packetId) {
            if (player != null && player.selectVideoTrack) {
                logDemo('select MMTS video packet_id=0x' + Number(packetId).toString(16));
                player.selectVideoTrack(packetId);
            }
        }

        function parseOptionalInteger(value) {
            var text = String(value || '').trim();
            if (text === '') {
                return null;
            }

            var radix = /^0x/i.test(text) ? 16 : 10;
            var parsed = parseInt(text, radix);
            return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
        }

        function setupMediaElementDebug(element) {
            element.onerror = function() {
                var error = element.error;
                logDemo('video error: code=' + (error && error.code) + ', message=' + (error && error.message));
            };
            element.onloadedmetadata = function() {
                logDemo('loadedmetadata: duration=' + element.duration + ', video=' + element.videoWidth + 'x' + element.videoHeight);
                renderVideoInfo();
            };
            element.onplaying = function() {
                logDemo('playing: currentTime=' + element.currentTime);
                renderVideoInfo();
            };
            element.onstalled = function() {
                logDemo('stalled: currentTime=' + element.currentTime);
            };
            element.onwaiting = function() {
                logDemo('waiting: currentTime=' + element.currentTime);
            };
            element.onseeked = function() {
                logDemo('seeked: currentTime=' + element.currentTime);
                replayCachedTTMLSubtitles();
            };
        }

        function setupTTMLSubtitleOverlay(element) {
            clearTTMLSubtitleOverlay();
            var overlay = document.getElementById('ttmlSubtitleOverlay');
            if (!window.aribb62js || !window.aribb62js.B62TTMLRenderer) {
                logDemo('aribb62.js is not loaded');
                return;
            }
            ttmlSubtitleRenderer = new window.aribb62js.B62TTMLRenderer({
                mediaElement: element,
                overlayElement: overlay,
                isLive: document.getElementById('isLive').checked,
                maxCues: 100000
            });
        }

        function clearTTMLSubtitleOverlay() {
            if (ttmlSubtitleRenderer) {
                ttmlSubtitleRenderer.destroy();
                ttmlSubtitleRenderer = null;
            }
            ttmlSubtitleEventCount = 0;
            ttmlSubtitleLastStatus = null;
            resetTTMLSubtitleDataCache();
            renderTTMLSubtitleStatus();
        }

        function pushMMTSTTMLSubtitleData(video, data, options) {
            options = options || {};
            if (!options.replay) {
                cacheTTMLSubtitleData(data);
            }
            if (selectedMMTSSubtitlePacketId !== null && (!data || data.packetId !== selectedMMTSSubtitlePacketId)) {
                return;
            }
            if (!ttmlSubtitleRenderer) {
                setupTTMLSubtitleOverlay(video);
                if (!ttmlSubtitleRenderer) {
                    return;
                }
            }
            ttmlSubtitleRenderer.setLive(video.duration === Infinity || document.getElementById('isLive').checked);

            var result = ttmlSubtitleRenderer.push(data);
            result.resourcesComplete = data && data.resourcesComplete;
            result.dts = data && data.dts;
            result.rawPts = data && data.rawPts;
            result.rawDts = data && data.rawDts;
            result.subtitleTimingMode = data && data.subtitleTimingMode;
            result.subtitleReferenceStartTime = data && data.subtitleReferenceStartTime;
            result.subtitleReferenceStartMediaTime = data && data.subtitleReferenceStartMediaTime;
            result.videoMediaDts = data && data.videoMediaDts;
            result.videoMediaPts = data && data.videoMediaPts;
            result.videoRawDtsBase = data && data.videoRawDtsBase;
            result.videoDtsBase = data && data.videoDtsBase;
            result.videoSampleIndex = data && data.videoSampleIndex;
            result.droppedVideoSampleCount = data && data.droppedVideoSampleCount;
            cacheTTMLFontDownloads(result.fontFaces || [], data);
            ttmlSubtitleEventCount = result.eventCount;
            var timeline = inspectTTMLTimeline(result.text, result.timelineOffset);
            result.timelineDebug = timeline;
            updateTTMLSubtitleStatus(result);
            if (!options.replay) {
                logDemo('mmts subtitle data #' + result.eventCount +
                    ': packet_id=' + formatPacketId(result.packetId) +
                    ', cues=' + result.cueCount +
                    ', cached=' + ttmlSubtitleDataCache.length +
                    ', resources=' + (result.resourceCount || 0) +
                    ', resources_complete=' + (data && data.resourcesComplete ? 1 : 0) +
                    ', fonts=' + (result.fontFaceCount || 0) +
                    ', ' + formatMMTSPacketTimeline(data) +
                    ', base=' + (result.basePts !== null ? formatSeconds(result.basePts) : 'n/a') +
                    ', effective=' + (result.effectiveBasePts !== null ? formatSeconds(result.effectiveBasePts) : 'n/a') +
                    ', offset=' + (result.timelineOffset !== null ? formatSeconds(result.timelineOffset) : 'n/a') +
                    ', ttml_abs=' + formatTimelineRange(timeline.minBegin, timeline.maxEnd) +
                    ', ttml_rel=' + formatTimelineRange(timeline.minRelativeBegin, timeline.maxRelativeEnd) +
                    (result.arrivalAligned ? ', arrival-aligned' : '') +
                    ', len=' + result.len);
            }
        }

        function inject_test_ttml_subtitle() {
            var video = document.getElementsByName('videoElement')[0];
            var now = video ? video.currentTime : 0;
            var text =
                '<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling" tts:extent="3840px 2160px" xml:lang="ja">' +
                '<head>' +
                '<styling>' +
                '<style xml:id="s1" tts:fontSize="160px 160px" tts:lineHeight="200px" tts:color="#FFFFFFFF" tts:backgroundColor="#000000CC"/>' +
                '</styling>' +
                '<layout>' +
                '<region xml:id="r1" tts:origin="480px 1240px" tts:extent="2880px 420px" tts:displayAlign="center"/>' +
                '</layout>' +
                '</head>' +
                '<body><div><p region="r1" begin="00:00:00.000" end="00:00:05.000" style="s1"><span>ARIB-TTML demo 字幕テスト</span></p></div></body>' +
                '</tt>';
            pushMMTSTTMLSubtitleData(video, {
                packetId: selectedMMTSSubtitlePacketId !== null ? selectedMMTSSubtitlePacketId : 0xf338,
                pts: Math.floor(now * 1000),
                text: text,
                len: text.length
            });
        }

        function clearActiveTTMLSubtitleCues() {
            if (ttmlSubtitleRenderer) {
                ttmlSubtitleRenderer.clear();
            }
        }

        function cacheTTMLSubtitleData(data) {
            if (!data) {
                return;
            }
            ttmlSubtitleDataCache.push(data);
        }

        function resetTTMLSubtitleDataCache() {
            ttmlSubtitleDataCache = [];
            ttmlSubtitleReplayActive = false;
            ttmlCachedFontFaces.forEach(function(fontFace) {
                if (fontFace.ownedUrl && fontFace.url && typeof URL !== 'undefined' && URL.revokeObjectURL) {
                    URL.revokeObjectURL(fontFace.url);
                }
            });
            ttmlCachedFontFaces = [];
            ttmlCachedFontFaceKeys = {};
        }

        function replayCachedTTMLSubtitles() {
            if (ttmlSubtitleReplayActive || !ttmlSubtitleRenderer || ttmlSubtitleDataCache.length === 0) {
                return;
            }
            var video = document.getElementsByName('videoElement')[0];
            ttmlSubtitleReplayActive = true;
            clearActiveTTMLSubtitleCues();
            for (var i = 0; i < ttmlSubtitleDataCache.length; i++) {
                pushMMTSTTMLSubtitleData(video, ttmlSubtitleDataCache[i], { replay: true });
            }
            ttmlSubtitleReplayActive = false;
            logDemo('replayed cached TTML payloads: count=' + ttmlSubtitleDataCache.length);
            renderTTMLSubtitleStatus();
        }

        function cacheTTMLFontDownloads(fontFaces, data) {
            fontFaces.forEach(function(fontFace) {
                var key = [
                    data && data.packetId,
                    data && data.mpuSequenceNumber,
                    fontFace.resourceIndex,
                    fontFace.family,
                    fontFace.format,
                    fontFace.unicodeRange,
                    fontFace.src
                ].join('|');
                if (ttmlCachedFontFaceKeys[key]) {
                    return;
                }

                var cached = {
                    family: fontFace.family || '',
                    format: fontFace.format || '',
                    unicodeRange: fontFace.unicodeRange || '',
                    src: fontFace.src || '',
                    resourceIndex: fontFace.resourceIndex,
                    downloadName: fontFace.downloadName || '',
                    url: fontFace.url || '',
                    ownedUrl: false
                };
                var resource = findTTMLResourceByIndex(data, fontFace.resourceIndex);
                var bytes = resource ? toUint8Array(resource.data || resource.payload || resource.bytes) : null;
                if (bytes && typeof Blob !== 'undefined' && typeof URL !== 'undefined' && URL.createObjectURL) {
                    cached.url = URL.createObjectURL(new Blob([bytes], { type: mimeTypeForFontFormat(cached.format) }));
                    cached.ownedUrl = true;
                }
                if (!cached.url) {
                    return;
                }

                ttmlCachedFontFaceKeys[key] = true;
                ttmlCachedFontFaces.push(cached);
            });
        }

        function findTTMLResourceByIndex(data, index) {
            if (!data || !Number.isFinite(index)) {
                return null;
            }
            var lists = [data.resources, data.subsamples];
            for (var i = 0; i < lists.length; i++) {
                var list = lists[i];
                if (!Array.isArray(list)) {
                    continue;
                }
                for (var j = 0; j < list.length; j++) {
                    var item = list[j];
                    if (Number(firstDefined(
                        item && item.index,
                        item && item.subsampleIndex,
                        item && item.subsampleNumber,
                        item && item.subsample,
                        item && item.id
                    )) === index) {
                        return item;
                    }
                }
            }
            var maps = [data.resourceMap, data.resourcesBySubsample];
            for (var k = 0; k < maps.length; k++) {
                var map = maps[k];
                if (!map || typeof map !== 'object') {
                    continue;
                }
                if (map[index] !== undefined) {
                    var value = map[index];
                    return typeof value === 'object' && !(value instanceof Uint8Array) && !(value instanceof ArrayBuffer) ?
                        value :
                        { index: index, data: value };
                }
            }
            return null;
        }

        function firstDefined() {
            for (var i = 0; i < arguments.length; i++) {
                if (arguments[i] !== undefined && arguments[i] !== null) {
                    return arguments[i];
                }
            }
            return undefined;
        }

        function toUint8Array(data) {
            if (!data) {
                return null;
            }
            if (data instanceof Uint8Array) {
                return data;
            }
            if (data instanceof ArrayBuffer) {
                return new Uint8Array(data);
            }
            if (Array.isArray(data)) {
                return new Uint8Array(data);
            }
            return null;
        }

        function mimeTypeForFontFormat(format) {
            switch (String(format || '').toLowerCase()) {
                case 'svg':
                    return 'image/svg+xml';
                case 'woff':
                    return 'font/woff';
                default:
                    return 'application/octet-stream';
            }
        }

        function updateTTMLSubtitleStatus(result) {
            ttmlSubtitleLastStatus = result;
            renderTTMLSubtitleStatus();
        }

        function renderTTMLSubtitleStatus() {
            var container = document.getElementById('ttmlSubtitleStatus');
            if (!container) {
                return;
            }
            if (!ttmlSubtitleLastStatus) {
                container.textContent = 'TTML payload events=' + ttmlSubtitleEventCount + '  selected=' + (selectedMMTSSubtitlePacketId === null ? 'all' : formatPacketId(selectedMMTSSubtitlePacketId));
                renderTTMLFontDownloads(null);
                return;
            }

            var status = ttmlSubtitleLastStatus;
            var parts = [
                'TTML payload events=' + ttmlSubtitleEventCount,
                'selected=' + (selectedMMTSSubtitlePacketId === null ? 'all' : formatPacketId(selectedMMTSSubtitlePacketId)),
                'last_packet=' + formatPacketId(status.packetId),
                'cues=' + status.cueCount,
                'cached=' + ttmlSubtitleDataCache.length,
                'resources=' + (status.resourceCount || 0),
                'resources_complete=' + (status.resourcesComplete ? 1 : 0),
                'fonts=' + (status.fontFaceCount || 0),
                'pts=' + (status.pts !== undefined ? status.pts : 'n/a'),
                'base=' + (status.basePts !== null ? formatNumber(status.basePts, 3) : 'n/a'),
                'effective=' + (status.effectiveBasePts !== null ? formatNumber(status.effectiveBasePts, 3) : 'n/a'),
                'offset=' + (status.timelineOffset !== null ? formatNumber(status.timelineOffset, 3) : 'n/a'),
                'len=' + status.len
            ];
            if (status.arrivalAligned) {
                parts.push('arrival-aligned');
            }
            if (status.timelineDebug) {
                parts.push('pkt_rel=' + formatMsSeconds(status.pts) + '/' + formatMsSeconds(status.dts));
                parts.push('pkt_abs=' + formatMsSeconds(status.rawPts) + '/' + formatMsSeconds(status.rawDts));
                parts.push('tmd=' + (status.subtitleTimingMode !== undefined ? status.subtitleTimingMode : 'n/a'));
                parts.push('ref_start=' + formatMsSeconds(status.subtitleReferenceStartTime));
                parts.push('ref_media=' + formatMsSeconds(status.subtitleReferenceStartMediaTime));
                parts.push('video_media=' + formatMsSeconds(status.videoMediaDts) + '/' + formatMsSeconds(status.videoMediaPts));
                parts.push('video_base=' + formatMsSeconds(status.videoRawDtsBase) + '/' + formatMsSeconds(status.videoDtsBase));
                parts.push('video_samples=' + (status.videoSampleIndex !== undefined ? status.videoSampleIndex : 'n/a'));
                parts.push('dropped_video=' + (status.droppedVideoSampleCount !== undefined ? status.droppedVideoSampleCount : 'n/a'));
                parts.push('ttml_abs=' + formatTimelineRange(status.timelineDebug.minBegin, status.timelineDebug.maxEnd));
                parts.push('ttml_rel=' + formatTimelineRange(status.timelineDebug.minRelativeBegin, status.timelineDebug.maxRelativeEnd));
            }
            container.textContent = parts.join('  ') +
                (status.preview ? '\npreview=' + status.preview : '') +
                (status.previewCodePoints ? '\ncodepoints=' + status.previewCodePoints : '');
            renderTTMLFontDownloads(ttmlCachedFontFaces);
        }

        function renderTTMLFontDownloads(fontFaces) {
            var container = document.getElementById('ttmlFontDownloads');
            if (!container) {
                return;
            }
            container.innerHTML = '';
            if (!fontFaces || fontFaces.length === 0) {
                container.textContent = 'No TTML fonts';
                return;
            }

            var title = document.createElement('div');
            title.textContent = 'TTML font downloads';
            container.appendChild(title);
            fontFaces.forEach(function(fontFace, index) {
                var link = document.createElement('a');
                link.href = fontFace.url;
                link.download = fontFace.downloadName || ('aribb62-font-' + index + '.' + (fontFace.format || 'bin'));
                link.textContent = [
                    'font ' + index,
                    fontFace.format || 'unknown',
                    fontFace.unicodeRange || 'all',
                    fontFace.family || '',
                    fontFace.downloadName || ''
                ].filter(Boolean).join('  ');
                container.appendChild(link);
            });
        }

        function formatPacketId(packetId) {
            return Number.isFinite(packetId) ? '0x' + Number(packetId).toString(16) : 'n/a';
        }

        function probe_video_capability() {
            var contentType = lastVideoContentType;
            var element = document.getElementsByName('videoElement')[0];
            logDemo('canPlayType(' + contentType + ')=' + element.canPlayType(contentType));
            if (!navigator.mediaCapabilities || !navigator.mediaCapabilities.decodingInfo) {
                logDemo('mediaCapabilities.decodingInfo unavailable');
                return;
            }
            navigator.mediaCapabilities.decodingInfo({
                type: 'media-source',
                video: {
                    contentType: contentType,
                    width: lastMediaInfo && lastMediaInfo.width || 7680,
                    height: lastMediaInfo && lastMediaInfo.height || 4320,
                    bitrate: 80000000,
                    framerate: lastMediaInfo && lastMediaInfo.fps || 60
                }
            }).then(function(info) {
                logDemo('mediaCapabilities: ' + JSON.stringify(info));
            }).catch(function(error) {
                logDemo('mediaCapabilities error: ' + error.message);
            });
        }

        function switch_url() {
            streamURL.className = '';
            mediaSourceURL.className = 'hidden';
            saveSettings();
        }

        function switch_mds() {
            streamURL.className = 'hidden';
            mediaSourceURL.className = '';
            saveSettings();
        }

        function ls_get(key, def) {
            try {
                var ret = localStorage.getItem('mpegts_demo.' + key);
                if (ret === null) {
                    ret = def;
                }
                return ret;
            } catch (e) {}
            return def;
        }

        function ls_set(key, value) {
            try {
                localStorage.setItem('mpegts_demo.' + key, value);
            } catch (e) {}
        }

        function saveSettings() {
            if (mediaSourceURL.className === '') {
                ls_set('inputMode', 'MediaDataSource');
            } else {
                ls_set('inputMode', 'StreamURL');
            }
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                ls_set(field, checkbox.checked ? '1' : '0');
            }
            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            var mmtsVideoPid = document.getElementById('mmtsVideoPid');
            ls_set('mediaType', mediaType.value);
            ls_set('msURL', msURL.value);
            ls_set('sURL', sURL.value);
            ls_set('mmtsVideoPid', mmtsVideoPid.value);
            console.log('save');
        }

        function loadSettings() {
            var i;
            for (i = 0; i < checkBoxFields.length; i++) {
                var field = checkBoxFields[i];
                /** @type {HTMLInputElement} */
                var checkbox = document.getElementById(field);
                var c = ls_get(field, checkbox.checked ? '1' : '0');
                checkbox.checked = c === '1' ? true : false;
            }

            var msURL = document.getElementById('msURL');
            var sURL = document.getElementById('sURL');
            var mediaType = document.getElementById('mediaType');
            var mmtsVideoPid = document.getElementById('mmtsVideoPid');
            mediaType.value = ls_get('mediaType', mediaType.value);
            msURL.value = ls_get('msURL', msURL.value);
            sURL.value = ls_get('sURL', sURL.value);
            mmtsVideoPid.value = ls_get('mmtsVideoPid', mmtsVideoPid.value);
            if (sURL.value === '../sample/BS17_0.mmts') {
                sURL.value = 'BS17_0.mmts';
            }
            if (ls_get('inputMode', 'StreamURL') === 'StreamURL') {
                switch_url();
            } else {
                switch_mds();
            }
        }

        function showVersion() {
            var version = mpegts.version;
            document.title = document.title + " (v" + version + ")";
        }

        var sURL = document.getElementById('sURL');
        sURL.onkeyup = function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                saveSettings()
                if (player != null) {
                    player.unload();
                    player.detachMediaElement();
                    player.destroy();
                    player = null;
                }
                player_load();
            }
        };

        var logcatbox = document.getElementsByName('logcatbox')[0];
        mpegts.LoggingControl.addLogListener(function(type, str) {
            logcatbox.value = logcatbox.value + str + '\n';
            logcatbox.scrollTop = logcatbox.scrollHeight;
        });

        document.addEventListener('DOMContentLoaded', function () {
            streamURL = document.getElementById('streamURL');
            mediaSourceURL = document.getElementById('mediaSourceURL');
            loadSettings();
            showVersion();
            player_load();
        });
    </script>
    
</body>

</html>
